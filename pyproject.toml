[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python3-lincmox-driver"
version = "1.0.0"
description = "Python driver to control LincStation LEDs"
authors = [{name = "Florent GAUDIN", email = "florent.gaudin@lincmox.ovh"}]
requires-python = ">=3.6"
dependencies = ["smbus2"]

[project.urls]
Homepage = "https://doc.lincmox.ovh"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}
